name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rag_kro
          POSTGRES_USER: rag_kro
          POSTGRES_PASSWORD: rag_kro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_kro -d rag_kro"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://rag_kro:rag_kro@localhost:5432/rag_kro
      REQUIRE_TENANT_KEY: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shared package (with dev deps)
        run: pip install -e "./packages/python/rag_kro_shared[dev]"

      - name: Apply Postgres schema
        run: |
          pip install psycopg[binary]
          PGPASSWORD=rag_kro psql -h localhost -U rag_kro -d rag_kro \
            -f infra/postgres/init/001_schema.sql

      - name: Seed tenant key + run isolation tests
        run: |
          python - <<'PY'
          from rag_kro_shared import get_settings, session_scope
          from rag_kro_shared.models import TenantKey
          import uuid
          s = get_settings()
          with session_scope() as db:
              db.add(TenantKey(tenant_id=uuid.UUID(s.default_tenant_id),
                               api_key=s.tenant_default_key, label="ci"))
          print("seeded")
          PY
          pytest tests/test_isolation.py -v

      - name: Compile check all python
        run: |
          python -m compileall -q \
            packages services/api services/rag services/ingestion \
            services/worker services/ig-gateway

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install + typecheck web
        working-directory: services/web
        run: |
          npm install
          npx tsc --noEmit
      - name: Node syntax check gateways
        working-directory: services/wa-gateway
        run: node --check src/index.js && node --check src/socket.js && node --check src/send.js

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          POSTGRES_PASSWORD: rag_kro
          MINIO_ROOT_PASSWORD: rag_kro_minio
        run: docker compose config --quiet