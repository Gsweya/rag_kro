[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kro-shared"
version = "0.1.0"
description = "Shared config, DB, crypto, LLM, embeddings and vector clients for all rag_kro python services."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "cryptography>=42.0,<45",
    "httpx>=0.27,<1",
    "qdrant-client>=1.12,<2",
    "fastapi>=0.111,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_kro_shared*"]